# Production-style deployment: Polymnia + PostgreSQL 17.
# Usage: cp .env.example .env, edit it (POSTGRES_PASSWORD and POLYMNIA_ALLOWED_HOSTS are required),
# then `docker compose up -d --wait`. See docs/self-hosting.md.
#
# Start-up order: db (healthy) -> migrate (one-shot, applies the EF Core migrations, exits 0) -> app.
# Migrations are an explicit service, never run inside the app: a failed migration stops the
# deployment before the new version serves traffic. Run them alone with `docker compose run --rm migrate`.

x-polymnia: &polymnia
  image: ${POLYMNIA_IMAGE:-ghcr.io/sputier/polymnia}:${POLYMNIA_VERSION:-latest}
  environment: &polymnia-env
    # Not "Development": stack traces, HTTPS redirection and HSTS behave as in production.
    ASPNETCORE_ENVIRONMENT: Production
    # Host names the app answers to, separated by ";". Required: there is no permissive default.
    AllowedHosts: ${POLYMNIA_ALLOWED_HOSTS:?Set POLYMNIA_ALLOWED_HOSTS in .env (see .env.example)}
    ConnectionStrings__Polymnia: Host=db;Database=${POSTGRES_DB:-polymnia};Username=${POSTGRES_USER:-polymnia};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    # Google sign-in (docs/authentication.md). Required: Production refuses to start without them.
    Auth__PublicBaseUrl: ${POLYMNIA_PUBLIC_BASE_URL:?Set POLYMNIA_PUBLIC_BASE_URL in .env (see .env.example)}
    Auth__Google__ClientId: ${POLYMNIA_GOOGLE_CLIENT_ID:?Set POLYMNIA_GOOGLE_CLIENT_ID in .env (see .env.example)}
    Auth__Google__ClientSecret: ${POLYMNIA_GOOGLE_CLIENT_SECRET:?Set POLYMNIA_GOOGLE_CLIENT_SECRET in .env (see .env.example)}
    # Who runs this instance, shown on the privacy page (docs/privacy.md). The first three are required:
    # Production refuses to start without them.
    Legal__OperatorName: ${POLYMNIA_LEGAL_OPERATOR_NAME:?Set POLYMNIA_LEGAL_OPERATOR_NAME in .env (see .env.example)}
    Legal__Contact: ${POLYMNIA_LEGAL_CONTACT:?Set POLYMNIA_LEGAL_CONTACT in .env (see .env.example)}
    Legal__HostingProvider: ${POLYMNIA_LEGAL_HOSTING_PROVIDER:?Set POLYMNIA_LEGAL_HOSTING_PROVIDER in .env (see .env.example)}
    Legal__Address: ${POLYMNIA_LEGAL_ADDRESS:-}
    Legal__HostingCountry: ${POLYMNIA_LEGAL_HOSTING_COUNTRY:-}
    Legal__LogRetentionDays: ${POLYMNIA_LOG_RETENTION_DAYS:-30}
    # Contact form (docs/contact.md). Optional: with FORWARD_TO, FROM and SMTP_HOST all set, messages are forwarded by
    # e-mail (TLS required, never plain); without them they are only stored in the database and the app logs a warning
    # at start-up. Giving only some of them stops the start. Empty values mean "not set".
    Contact__ForwardTo: ${POLYMNIA_CONTACT_FORWARD_TO:-}
    Contact__From: ${POLYMNIA_CONTACT_FROM:-}
    Contact__SmtpHost: ${POLYMNIA_CONTACT_SMTP_HOST:-}
    Contact__SmtpPort: ${POLYMNIA_CONTACT_SMTP_PORT:-587}
    Contact__SmtpSecurity: ${POLYMNIA_CONTACT_SMTP_SECURITY:-StartTls}
    Contact__SmtpUser: ${POLYMNIA_CONTACT_SMTP_USER:-}
    # The SMTP password is read from a Docker secret file (not the environment, where `docker inspect` shows it). An empty
    # file, the default (/dev/null), means no password. A Contact__SmtpPassword variable would only be the fallback.
    Contact__SmtpPasswordFile: /run/secrets/polymnia_smtp_password
    Contact__RetentionDays: ${POLYMNIA_CONTACT_RETENTION_DAYS:-90}
    # The Data Protection keys (stored in the database) are encrypted with this certificate. Required: see
    # docs/authentication.md for the one-line openssl command that creates it.
    DataProtection__CertificatePath: /run/secrets/polymnia_keys
    # The password is read from a Docker secret file, not from the environment (`docker inspect` would show it).
    DataProtection__CertificatePasswordFile: /run/secrets/polymnia_keys_password
    # Behind a reverse proxy only. Only the compose network is trusted as a proxy source.
    ForwardedHeaders__Enabled: ${POLYMNIA_FORWARDED_HEADERS:-false}
    ForwardedHeaders__KnownNetworks__0: ${POLYMNIA_SUBNET:-172.31.250.0/24}
  secrets:
    # Plain `docker compose` bind-mounts file secrets and ignores uid/gid/mode (tested: the container user could not
    # read the files). The host files must therefore belong to the container user (UID 1654) with mode 0400:
    # `sudo chown 1654:1654 secrets/polymnia-keys.* && sudo chmod 0400 secrets/polymnia-keys.*` (docs/authentication.md).
    - polymnia_keys
    - polymnia_keys_password
    - polymnia_smtp_password
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73 # postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polymnia}
      POSTGRES_DB: ${POSTGRES_DB:-polymnia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - polymnia-db:/var/lib/postgresql/data
    # Least privilege: the entrypoint only needs to fix the ownership of the data directory and drop to the
    # postgres user (tested with a fresh and an existing volume). No way to gain privileges afterwards.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    # No published port: only the app reaches the database, over the private compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    <<: *polymnia
    restart: "no"
    command: ["--migrate"]
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *polymnia
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # Loopback by default: put a TLS reverse proxy in front (docs/self-hosting.md).
      - "${POLYMNIA_BIND:-127.0.0.1}:${POLYMNIA_PORT:-8080}:8080"
    # The chiseled image has no shell or curl: the app binary probes itself (GET /api/health).
    healthcheck:
      test: ["CMD", "dotnet", "Polymnia.Api.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

secrets:
  polymnia_keys:
    # PKCS#12 file (password protected).
    file: ${POLYMNIA_KEYS_CERT_FILE:-./secrets/polymnia-keys.pfx}
  polymnia_keys_password:
    # Text file holding the password of the PKCS#12 file (a trailing newline is ignored).
    file: ${POLYMNIA_KEYS_CERT_PASSWORD_FILE:-./secrets/polymnia-keys.password}

  polymnia_smtp_password:
    # Optional, for the contact form (docs/contact.md): a text file holding the SMTP password (a trailing newline is
    # ignored). The default is /dev/null: no password. Same ownership rules as the key files (UID 1654, mode 0400).
    file: ${POLYMNIA_CONTACT_SMTP_PASSWORD_FILE:-/dev/null}

networks:
  default:
    ipam:
      config:
        - subnet: ${POLYMNIA_SUBNET:-172.31.250.0/24}

volumes:
  polymnia-db:
